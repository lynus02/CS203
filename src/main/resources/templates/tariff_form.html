<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tariff Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">
        <h1 class="text-2xl font-bold text-center text-gray-700 mb-6">Tariff Calculation Form</h1>

        <form action="/calculate-tariff" method="post" class="space-y-5">

            <!-- Ingredient -->
            <div class="relative">
                <label for="hsDescription" class="block text-gray-600 font-medium mb-2">HS Description</label>
                <input type="text" id="hsDescription" name="hsDescription"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="Start typing..." autocomplete="off" required>
                <ul id="hsDescription-suggestions"
                    class="absolute bg-white border rounded-lg w-full mt-1 hidden shadow-lg z-10"></ul>
            </div>

            <!-- HS Code -->
            <div class="relative">
                <label for="hsCode" class="block text-gray-600 font-medium mb-2">HS Code</label>
                <input type="text" id="hsCode" name="hsCode"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="e.g. 070200" autocomplete="off" required>
                <ul id="hscode-suggestions"
                    class="absolute bg-white border rounded-lg w-full mt-1 hidden shadow-lg z-10"></ul>
            </div>

            <!-- CIF Value -->
            <div>
                <label for="cifValue" class="block text-gray-600 font-medium mb-2">CIF Value (USD)</label>
                <input type="number" step="0.01" id="cifValue" name="cifValue"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="e.g. 1000" required>
            </div>

            <!-- Tariff Rate -->
            <div>
                <label for="tariffRate" class="block text-gray-600 font-medium mb-2">Tariff Rate (%)</label>
                <input type="number" step="0.01" id="tariffRate" name="tariffRate"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="e.g. 10" required>
            </div>

            <!-- VAT Rate -->
            <div>
                <label for="vatRate" class="block text-gray-600 font-medium mb-2">VAT Rate (%)</label>
                <input type="number" step="0.01" id="vatRate" name="vatRate"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="e.g. 5" required>
            </div>

            <!-- Submit -->
            <div class="text-center">
                <button type="submit"
                        class="w-full bg-blue-500 text-white py-2 rounded-lg shadow-md hover:bg-blue-600 transition">
                    Calculate Tariff
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    async function fetchSuggestions(inputId, listId, endpoint) {
        const input = document.getElementById(inputId);
        const list = document.getElementById(listId);

        input.addEventListener("input", async () => {
            const query = input.value;
            if (query.length < 2) {
                list.classList.add("hidden");
                return;
            }
            const response = await fetch(`/api/${endpoint}?query=${query}`);
            const suggestions = await response.json();

            list.innerHTML = "";
            if (suggestions.length === 0) {
                list.classList.add("hidden");
                return;
            }

            suggestions.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item;
                li.className = "px-4 py-2 hover:bg-blue-100 cursor-pointer";
                li.addEventListener("click", async () => {
                    input.value = item;
                    list.classList.add("hidden");
                    if (inputId === "hsDescription") {
                        // Fetch and set HS Code
                        const response = await fetch(`/api/hsCodeByDescription?description=${encodeURIComponent(item)}`);
                        const hsCode = await response.text();
                        document.getElementById('hsCode').value = hsCode;
                    }
                    if (inputId === "hsCode") {
                        // Fetch and set HS Description
                        const response = await fetch(`/api/hsDescriptionByCode?hsCode=${encodeURIComponent(item)}`);
                        const description = await response.text();
                        document.getElementById('hsDescription').value = description;
                    }
                });
                list.appendChild(li);
            });

            list.classList.remove("hidden");
        });
    }

    fetchSuggestions("hsDescription", "hsDescription-suggestions", "hsDescriptions");
    fetchSuggestions("hsCode", "hscode-suggestions", "hscodes");
</script>
</body>
</html>
