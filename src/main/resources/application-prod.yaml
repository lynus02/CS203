# PRODUCTION PROFILE
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3                # Very small pool for migration
      connection-timeout: 20000           # 20 seconds
      max-lifetime: 1200000               # 20 minutes (much longer)
      idle-timeout: 900000                # 15 minutes
      leak-detection-threshold: 300000    # 5 minutes (longer for migration)
      auto-commit: false
      validation-timeout: 5000
      keepalive-time: 60000               # 1 minute
  jpa:
    hibernate:
      ddl-auto: validate                    # Safe for production
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 10
    baseline-on-migrate: true

# Production Logging - Performance focused
logging:
  level:
    com.lynus.cs203: INFO
    com.lynus.cs203.controllers: INFO
    com.lynus.cs203.services: INFO
    com.lynus.cs203.services.DataMigrationService: INFO  # Monitor migration
    com.lynus.cs203.config: WARN
    org.hibernate.SQL: ERROR                # No SQL logging in production
    org.hibernate.type: ERROR
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.boot: INFO
    org.springframework.boot.autoconfigure: WARN
    org.springframework.transaction: WARN   # Monitor transaction issues
    com.zaxxer.hikari: WARN                # Connection pool warnings only
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"