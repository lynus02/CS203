# DEVELOPMENT PROFILE
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tariff
    username: root
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false                          # Disable for better performance
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc.batch_size: 5000               # Match your Java batch size
        order_inserts: true                  # Critical for batch performance
        order_updates: true

# Development Logging - Verbose for debugging
logging:
  level:
    com.lynus.cs203: DEBUG
    com.lynus.cs203.services.DataMigrationService: DEBUG  # Focus on migration
    com.lynus.cs203.services.TradeAgreementMigrationService: DEBUG
    org.hibernate.SQL: WARN                  # Reduce SQL noise during migration
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-30logger{30}){cyan} %msg%n"
  file:
    name: logs/cs203-dev.log