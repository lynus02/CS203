# DEVELOPMENT PROFILE
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tariff
    username: root
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Development Logging - Verbose for debugging
logging:
  level:
    com.lynus.cs203: DEBUG           # Your application classes
    com.lynus.cs203.controllers: DEBUG
    com.lynus.cs203.services: DEBUG
    com.lynus.cs203.config: INFO
    org.hibernate.SQL: DEBUG         # SQL queries
    org.hibernate.type: TRACE        # Query parameters
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-30logger{30}){cyan} %msg%n"
  file:
    name: logs/cs203-dev.log