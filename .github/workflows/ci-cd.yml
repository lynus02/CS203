# Workflow name displayed in GitHub Actions Tab
name: CI/CD Pipeline

# Triggers that start this workflow
on:
  push:
    branches: [ master, testing ]   # Runs when pushed to main or testing branches
  pull_request:
    branches: [ master ]    # Runs when a PR is opened against main branch

jobs:
  test:
    runs-on: ubuntu-latest    # Use latest Ubuntu runner

    steps:
      - uses: actions/checkout@v4     # Downloads the repository

      # Install Java 21
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install Node.js 18
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Caches Maven dependencies to speed up builds
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      # Caches Node.js modules to speed up frontend builds
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # Runs all backend tests (unit + integration tests)
      - name: Run backend tests
        run: mvn clean test
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline

      # Installs frontend dependencies
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      # Skip frontend tests with coverage reporting
#      - name: Run frontend tests
#        run: npm test -- --coverage --watchAll=false
#        working-directory: ./frontend

      # Builds the complete application (backend + frontend)
      - name: Build application
        run: mvn clean package -DskipTests

  # DEPLOYMENT JOB - Deploys to Railway if tests pass
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      # Install Railway CLI and deploy
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          railway login --token $RAILWAY_TOKEN
          railway deploy --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
